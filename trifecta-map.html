:root {
  --dem: #62acdd;
  --rep: #db6363;
  --div: #c7a8cf;
  --dem-risk: #dce6f7;  /* Dem trifecta at risk */
  --rep-risk: #fbdad9;  /* GOP trifecta at risk */
  --none: #edebe7;
  --split: #c9c6bf;     /* coalition / power-sharing chamber */
  --ink: #121212;
  --ink-soft: #727272;
  --line: #dcdcdc;
  --font: "ET Sans", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: #fff; color: var(--ink); font-family: var(--font); }
.em { width: 100%; margin: 0 auto; padding: 28px 0 12px; }

.em-head { margin: 0 16px 18px; text-align: center; text-wrap: balance; font: 700 30px/1.15 var(--font); letter-spacing: -.005em; color: var(--ink); }
.em-toolbar { display: flex; flex-direction: column; align-items: center; gap: 16px; margin-bottom: 12px; }

.em-legend {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 18px; margin: 0; padding: 0 16px; list-style: none;
  font: 500 13px/1 var(--font); text-transform: uppercase; letter-spacing: .04em;
}
.em-legend li { display: flex; align-items: center; gap: 7px; }
.sw { width: 13px; height: 13px; border-radius: 50%; display: inline-block; }
.sw-d { background: var(--dem); }
.sw-r { background: var(--rep); }
.sw-dr, .sw-rr { background-image: repeating-linear-gradient(-45deg, rgba(255,255,255,.55) 0 1.5px, transparent 1.5px 4.5px); }
.sw-p { background-color: var(--div); }
.sw-dr { background-color: var(--dem-risk); }
.sw-rr { background-color: var(--rep-risk); }

.em-stage { position: relative; }
.em-map { width: 100%; aspect-ratio: 1.7014; background: #fff; }
.maplibregl-canvas { outline: none; }

.lbl { font: 500 13px/1 var(--font); letter-spacing: .01em; pointer-events: none; white-space: nowrap; color: #fff; }
.lbl.dark { color: #3d3b37; }
.lbl.call { color: #3d3b37; }

/* ---------- hover card: one bar per office ---------- */
/* thick white mat + black hairline + hard shadow, so it lifts clearly off the colored map */
.tri {
  position: absolute; z-index: 4; pointer-events: none; left: 0; top: 0;
  width: 208px; padding: 7px; background: #fff;
  outline: 1px solid #121212;
  box-shadow: 6px 6px 0 #121212;
  display: grid; gap: 4px;
  opacity: 0; transform-origin: 0 0; transition: opacity .12s ease;
}
.tri.show { opacity: 1; }
.tri .bar {
  display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
  padding: 10px 11px 8px;
  font: 500 13px/1 var(--font); letter-spacing: .08em; color: #fff;
}
.tri .bar small { font: italic 400 12px/1 var(--font); letter-spacing: 0; opacity: .85; }
/* lighter / mixed colors: white stripes like the map, black type on top */
.tri .bar.light { color: #121212; }
.tri .bar.hatch {
  color: #121212;
  background-image: repeating-linear-gradient(-45deg, rgba(255,255,255,.55) 0 2px, transparent 2px 7px);
}

.em-foot { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-top: 8px; }
.em-credit { font: 400 10px/1.4 var(--font); color: var(--ink-soft); margin: 0; text-transform: uppercase; letter-spacing: .04em; }

@media (max-width: 640px) {
  .em { padding: 12px 0; }
  .em-legend { font-size: 11px; gap: 6px 12px; }
  .em-head { font-size: 22px; margin-bottom: 12px; }
  .em-foot { padding: 0 16px; }
  .lbl { font-size: 10px; }
}
  </style>
</head>

abel":[-76.9905,38.8933],"inset":false},"geometry":{"type":"Polygon","coordinates":[[[-77.12,38.934],[-77.041,38.996],[-76.909,38.893],[-77.039,38.792],[-77.041,38.871],[-77.12,38.934]]]}}]}};</script>
  <script>
(() => {
  const COLOR = {
    D: "#62acdd", R: "#db6363", C: "#a8a49c", div: "#c7a8cf",
    riskD: "#dce6f7", riskR: "#fbdad9", none: "#edebe7",
  };
  const US_BOUNDS = [[-124.73, 22.40], [-66.95, 49.38]];
  const $ = s => document.querySelector(s);
  const tri = $(".tri"), stage = $(".em-stage");
  const canHover = matchMedia("(hover: hover) and (pointer: fine)").matches;

  let hovered = null, labels = [], triFor = null;

  const isDivided = c => !(c.gov === c.senate && c.gov === c.house);
  function styleOf(postal) {
    const c = CONTROL[postal];
    if (!c) return "none";
    if (!isDivided(c)) return c.risk ? "risk" + c.risk : c.gov;
    return "purple";
  }
  function fillOf(postal) {
    return { D: COLOR.D, R: COLOR.R, riskD: COLOR.riskD, riskR: COLOR.riskR, purple: COLOR.div, none: COLOR.none }[styleOf(postal)];
  }

  const map = new maplibregl.Map({
    container: "map",
    bounds: US_BOUNDS,
    fitBoundsOptions: { padding: { top: 0, left: 0, right: 8, bottom: 8 } },
    style: { version: 8, sources: {}, layers: [{ id: "bg", type: "background", paint: { "background-color": "#fff" } }] },
    attributionControl: false,
    renderWorldCopies: false,
    dragPan: false, dragRotate: false, scrollZoom: false, doubleClickZoom: false,
    boxZoom: false, keyboard: false, touchZoomRotate: false, touchPitch: false,
  });
  new ResizeObserver(() => { map.resize(); map.fitBounds(US_BOUNDS, { padding: { top: 0, left: 0, right: 8, bottom: 8 }, duration: 0 }); }).observe($("#map"));
  map.loaded() ? setup() : map.once("load", setup);

  function setup() {
    map.addSource("states", { type: "geojson", data: GEO.states, promoteId: "postal" });
    map.addSource("callouts", { type: "geojson", data: calloutLines() });
    // solid dark-gray drop shadow: the whole map, offset down-right, no blur
    map.addLayer({ id: "shadow", type: "fill", source: "states",
      paint: { "fill-color": "#4a4a4a", "fill-translate": [5, 5], "fill-translate-anchor": "viewport" } });
    map.addLayer({ id: "states-fill", type: "fill", source: "states", paint: { "fill-color": COLOR.none } });
    // the two light "at risk" colors get white diagonal stripes
    ["riskD", "riskR"].forEach(s => map.addImage("hatch-" + s, hatch(fillHex(s)), { pixelRatio: 2 }));
    map.addLayer({ id: "states-hatch", type: "fill", source: "states", filter: ["==", ["get", "postal"], ""],
      paint: { "fill-pattern": "hatch-riskD" } });
    map.addLayer({ id: "states-line", type: "line", source: "states",
      paint: { "line-color": "#fff", "line-width": ["interpolate", ["linear"], ["zoom"], 3, 0.8, 7, 2] } });
    map.addLayer({ id: "callout-line", type: "line", source: "callouts",
      paint: { "line-color": "#8c8a85", "line-width": 0.8 } });
    map.addLayer({ id: "callout-dot", type: "circle", source: "callouts", filter: ["==", ["geometry-type"], "Point"],
      paint: { "circle-radius": 1.6, "circle-color": "#3d3b37" } });
    map.addLayer({ id: "states-hover", type: "line", source: "states",
      paint: { "line-color": "#121212", "line-width": 1.6,
        "line-opacity": ["case", ["boolean", ["feature-state", "hover"], false], 1, 0] } });

    map.on("mousemove", onMove);
    map.on("mouseout", hideTri);
    map.on("click", e => { if (!canHover) onMove(e); });

    render();
  }

  // ---------- colors ----------
  function render() {
    const pairs = GEO.states.features.flatMap(f => [f.properties.postal, fillOf(f.properties.postal)]);
    const expr = ["match", ["get", "postal"], ...pairs, COLOR.none];
    map.setPaintProperty("states-fill", "fill-color", expr);
    const hatched = GEO.states.features.map(f => f.properties.postal).filter(p => HATCHED.has(styleOf(p)));
    map.setFilter("states-hatch", ["in", ["get", "postal"], ["literal", hatched]]);
    map.setPaintProperty("states-hatch", "fill-pattern",
      ["match", ["get", "postal"], ...hatched.flatMap(p => [p, "hatch-" + styleOf(p)]), "hatch-riskD"]);
    drawLabels();
  }

  const HATCHED = new Set(["riskD", "riskR"]);
  function fillHex(style) { return { purple: COLOR.div, riskD: COLOR.riskD, riskR: COLOR.riskR }[style]; }
  // seamless tile: base color with a continuous white "/" stripe (1.5px wide, every 7px; built at 2x).
  // Coverage is computed per pixel from (x + y) mod P, so the stripes run unbroken across tile edges.
  function hatch(hex, P = 14, w = 3, SS = 4) {
    const base = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
    const data = new Uint8Array(P * P * 4);
    for (let y = 0; y < P; y++) for (let x = 0; x < P; x++) {
      let hit = 0;
      for (let j = 0; j < SS; j++) for (let i = 0; i < SS; i++) {
        const v = (x + (i + .5) / SS + y + (j + .5) / SS) % P;
        if (v < w) hit++;
      }
      const a = .55 * hit / (SS * SS), o = (y * P + x) * 4;
      for (let k = 0; k < 3; k++) data[o + k] = Math.round(base[k] + (255 - base[k]) * a);
      data[o + 3] = 255;
    }
    return { width: P, height: P, data };
  }

  // ---------- labels ----------
  function calloutLines() {
    const feats = [];
    Object.values(CALLOUTS).forEach(c => {
      // stop the line just short of the text
      const dx = c.label[0] - c.at[0], dy = c.label[1] - c.at[1], len = Math.hypot(dx, dy), k = (len - 0.18) / len;
      const end = c.anchor === "bottom" ? [c.label[0] + 0.25, c.label[1] - 0.12] : [c.at[0] + dx * k, c.at[1] + dy * k];
      feats.push({ type: "Feature", geometry: { type: "LineString", coordinates: [c.at, end] } });
      feats.push({ type: "Feature", geometry: { type: "Point", coordinates: c.at } });
    });
    return { type: "FeatureCollection", features: feats };
  }
  function drawLabels() {
    labels.forEach(m => m.remove()); labels = [];
    GEO.states.features.forEach(f => {
      const p = f.properties;
      if (p.postal === "DC") return;
      const el = document.createElement("div");
      const c = CALLOUTS[p.postal];
      if (c) {
        el.className = "lbl call";
        el.textContent = p.ap;
        labels.push(new maplibregl.Marker({ element: el, anchor: c.anchor === "bottom" ? "bottom-left" : "left" }).setLngLat(c.label).addTo(map));
        return;
      }
      const s = styleOf(p.postal);
      el.className = "lbl" + (s === "D" || s === "R" ? "" : " dark");
      el.textContent = p.ap;
      labels.push(new maplibregl.Marker({ element: el }).setLngLat(p.label).addTo(map));
    });
  }

  // ---------- hover ----------
  function setHover(id) {
    if (hovered === id) return;
    if (hovered) map.setFeatureState({ source: "states", id: hovered }, { hover: false });
    hovered = id;
    if (id) map.setFeatureState({ source: "states", id }, { hover: true });
  }
  function hideTri() { setHover(null); tri.classList.remove("show"); map.getCanvas().style.cursor = ""; }
  function onMove(e) {
    const f = map.queryRenderedFeatures(e.point, { layers: ["states-fill"] })[0];
    const postal = f && f.properties.postal, c = postal && CONTROL[postal];
    if (!c) return hideTri();
    setHover(postal);
    map.getCanvas().style.cursor = "pointer";
    if (triFor !== postal) { buildTri(c); triFor = postal; }
    tri.classList.add("show");
    const r = stage.getBoundingClientRect(), w = tri.offsetWidth, h = tri.offsetHeight;
    let x = e.point.x + 18, y = e.point.y + 18;
    if (x + w > r.width) x = e.point.x - w - 18;
    if (y + h > r.height) y = e.point.y - h - 18;
    tri.style.transform = `translate(${Math.max(0, x)}px, ${Math.max(0, y)}px)`;
  }

  // GOVERNOR / HOUSE / SENATE stacked. Blue = Dem., red = GOP, purple = coalition / power-sharing.
  // Non-competitive states: the party in control now. For the 14 competitive states the 2026 rating is printed
  // on the right and sets the color: the party it leans to (Toss-up keeps the party in control now);
  // "Solid" = dark color; anything weaker (Very Likely, Likely, Lean, Tilt, Toss-up) = light color with white stripes.
  const OFFICES = [["GOVERNOR", "gov"], ["HOUSE", "house"], ["SENATE", "senate"]];
  function barStyle(c, key) {
    const party = c[key], r = c.rating && c.rating[key];
    // coalition chambers (Alaska) are gray; a tied, power-sharing chamber (Minnesota) is purple, no stripes
    if (party === "C") return c.shared === "Coalition"
      ? { bg: COLOR.C, light: true, note: r || c.shared }
      : { bg: COLOR.div, light: true, note: r || c.shared };
    if (!c.rating) return { bg: COLOR[party], hatch: false };
    if (!r) return { bg: COLOR[party], hatch: false, note: "No race" };   // e.g. Kansas Senate is not up in 2026
    // the color follows the party the rating leans to; a Toss-up keeps the party in control now
    const lean = /^toss/i.test(r) ? party : r.trim().slice(-1);
    return /^solid/i.test(r) ? { bg: COLOR[lean], hatch: false, note: r } : { bg: COLOR["risk" + lean], hatch: true, note: r };
  }
  function buildTri(c) {
    tri.innerHTML = OFFICES.map(([word, key]) => {
      const s = barStyle(c, key);
      return `<div class="bar${s.hatch ? " hatch" : ""}${s.light ? " light" : ""}" style="background-color:${s.bg}">${word}${s.note ? `<small>${s.note}</small>` : ""}</div>`;
    }).join("");
  }
})();
  </script>
</body>
</html>
